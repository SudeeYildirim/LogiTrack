<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Akıllı Filo Takip Sistemi</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #0f172a, #1e40af);
            color: white;
        }

        .box {
            width: 600px;
            padding: 40px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background: white;
            color: #1e40af;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="box">
            <h1>Akıllı Filo Takip Sistemi</h1>
            <p>
                Manuel takip edilen lojistik süreçlerini dijital bir panel üzerinden
                yöneterek araç, şoför ve sefer durumlarını anlık takip etmeyi sağlar.
            </p>
            <a href="#" class="btn">Panele Giriş</a>
        </div>
    </div>

</body>
</html>
